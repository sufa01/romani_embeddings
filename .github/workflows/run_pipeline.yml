name: Run Romani Embeddings Pipeline

on:
  workflow_dispatch:  
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pdfplumber numpy pandas scikit-learn tqdm gensim matplotlib

      - name: Run pipeline
        run: python romani_embedding.py

      - name: Commit and push generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Автоматически сгенерированные файлы (embeddings, корпусы, визуализации)"
